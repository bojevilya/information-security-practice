services:
  api:
    build: .
    container_name: dean_office_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app_code        # hot-reload коду
      - db_data:/app_code/data   # персистентна БД SQLite
    environment:
      # Значення беруться з .env (не в Git!); без них compose зупиняється з помилкою
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY не задано в .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY не задано в .env}
      - BLIND_INDEX_KEY=${BLIND_INDEX_KEY:?BLIND_INDEX_KEY не задано в .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
    restart: unless-stopped

volumes:
  db_data:
